spring.application.name=fintrack-backend

server.port=${PORT:8080}

#H2 Embedded Database

spring.datasource.url=jdbc:h2:file:./data/fintrack;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=Naincy37

#JPA / Hibernate

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

#H2 Console

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#JWT Configuration

fintrack.jwt.secret=${JWT_SECRET:FinTrackSuperSecretKeyForDevelopmentOnlyChangeThisToA256BitSecretKey123456789}
fintrack.jwt.expiration=86400000