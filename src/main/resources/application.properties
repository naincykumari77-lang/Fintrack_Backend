spring.application.name=fintrack-backend

server.port=${PORT:8080}

# Online MySQL database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fintrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Naincy37}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
fintrack.jwt.secret=${JWT_SECRET:FinTrackSuperSecretKeyForDevelopmentOnlyChangeThisToA256BitSecretKey123456789}
fintrack.jwt.expiration=86400000